# ============================================================
# 两面（Two Sides）—— 生产编排
#
# 三个关注点：
#   web    : Caddy 静态托管 Vue 构建产物，并把 /api/* 反代到 server
#   server : Bun + Hono API + SQLite（预生成 cron 见下方 server 注释）
#
# 安全约定（红线）：
#   · 本文件不出现任何密钥字面量，只写 ${变量名} 引用
#   · 变量值由 compose 从项目根目录的 .env 自动插值（.env 已在 .gitignore 中）
#   · 未设置即启动会直接报错退出，避免"跑起来了但鉴权全挂"的静默失败
#
# 前置：复制一份 .env 并填入真实凭证；镜像由 GHCR 提供，不需要拉取代码仓库或本地构建。
# 可通过 GHCR_OWNER / IMAGE_TAG 覆盖镜像仓库与版本，默认使用 bingxin666 的 master 镜像。
# ============================================================

services:
  # ----------------------------------------------------------
  # 静态层 + 反向代理（不签证书、不占 443）
  # 对外 HTTPS 由你自行部署的反代终止，指向 127.0.0.1:8080 即可
  # ----------------------------------------------------------
  web:
    image: ghcr.io/${GHCR_OWNER:-bingxin666}/two-sides-web:${IMAGE_TAG:-master}
    pull_policy: always
    container_name: two-sides-web
    restart: unless-stopped
    # 只绑回环，公网入口交给宿主反代
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      # 用 started 而非 service_healthy：避免镜像内缺 curl 导致
      # healthcheck 失败时把 web 一起拖住（Caddy 自带重试）
      - server
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------
  # API 层：Bun + Hono + SQLite
  #
  # 每日预生成：进程内定时器（Bun timer 计算下一个 Asia/Shanghai 00:30），
  # 启动时也检查当日热榜：缺失则后台补生成，已有候选则补未完成的题。
  # 榜单和分析均持久化在 server-data 卷，重启复用当天结果。
  # ----------------------------------------------------------
  server:
    image: ghcr.io/${GHCR_OWNER:-bingxin666}/two-sides-server:${IMAGE_TAG:-master}
    pull_policy: always
    container_name: two-sides-server
    restart: unless-stopped
    # 不对外暴露端口，只经 Caddy 的 /api/* 进入
    expose:
      - "3000"
    environment:
      # ---- 时区铁律：所有按日快照以东八区日期为主键 ----
      TZ: Asia/Shanghai
      # ---- 知乎开放平台 ----
      # 唯一真必需凭证：未设置直接拒启（fail-fast）。
      # 静默缺省启动 = 每个请求都 AUTH_REQUIRED，那种失败模式远比拒启难排查。
      ZHIHU_ACCESS_SECRET: ${ZHIHU_ACCESS_SECRET:?请在 .env 中设置 ZHIHU_ACCESS_SECRET}
      ZHIHU_ZHIDA_MODEL: ${ZHIHU_ZHIDA_MODEL:-zhida-thinking-1p5}
      # ---- 增强层 OAuth（凭证未获批时留空，整层自动不启用）----
      ZHIHU_OAUTH_APP_ID: ${ZHIHU_OAUTH_APP_ID:-}
      ZHIHU_OAUTH_APP_KEY: ${ZHIHU_OAUTH_APP_KEY:-}
      ZHIHU_OAUTH_REDIRECT_URI: ${ZHIHU_OAUTH_REDIRECT_URI:-}
      # ---- 外部 LLM（与 config/providers.yaml 的 apiKeyEnv 一一对应）----
      # 未配置 key 的服务商会在 providers 注册表里标记 missing，不影响其余服务商
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      ORIGAMI_API_KEY: ${ORIGAMI_API_KEY:-}
      # ---- 管线开关 ----
      # 生产默认走真实知乎与 LLM；本地演练若需要假数据，必须显式设为 fake/0
      ZHIHU_LIVE: ${ZHIHU_LIVE:-1}
      # fake = 确定性假数据（仅显式开启）；llm = 真实多智能体管线
      PIPELINE_MODE: ${PIPELINE_MODE:-llm}
      PIPELINE_FAKE_DURATION_MS: ${PIPELINE_FAKE_DURATION_MS:-12000}
      RECOVER_ON_BOOT: ${RECOVER_ON_BOOT:-true}
      # ---- 运行时 ----
      SERVER_PORT: "3000"
      # SQLite 落在具名 volume 内，容器重建不丢快照
      ZHIDUAN_DB_PATH: /app/data/two-sides.db
      PROVIDERS_CONFIG: /app/config/providers.yaml
      # ---- 每日预生成 ----
      # 启动补生成 / 每日预生成题数上限（0 关闭自动预生成）
      PREGENERATE_TOP: ${PREGENERATE_TOP:-30}
      ANALYSIS_RETRY_COOLDOWN_SEC: ${ANALYSIS_RETRY_COOLDOWN_SEC:-60}
      ANALYSIS_JOB_TIMEOUT_SEC: ${ANALYSIS_JOB_TIMEOUT_SEC:-600}
      LLM_RPM_LIMIT: ${LLM_RPM_LIMIT:-1000}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      PIPELINE_EXTRACT_CONCURRENCY: ${PIPELINE_EXTRACT_CONCURRENCY:-30}
      PIPELINE_ORIENT_CONCURRENCY: ${PIPELINE_ORIENT_CONCURRENCY:-100}
      PREGENERATE_CONCURRENCY: ${PREGENERATE_CONCURRENCY:-4}
    volumes:
      # 按日分析快照（hot_questions / analyses / jobs）——具名 volume，持久化
      - server-data:/app/data
    healthcheck:
      # 知乎额度查询本身不消耗业务额度，可安全用于探活
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  server-data:
    name: two-sides-server-data
