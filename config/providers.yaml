# 两面 · LLM Provider 与 Agent 绑定
#
# 铁律（docs/04 §4）：本文件只写 env 变量名，永远不写密钥字面量。
# 任何出现真实密钥字面量的改动都是事故，评审前必查（安全扫描会对本文件 grep）。
#
# docs/03 §3：服务商与模型解耦，Agent 按名引用；failover 只在 Agent 级，
# 主路径连续失败 FAILOVER_THRESHOLD（默认 3）次后切到 fallback。
# 知乎直答不在这套配置里（独立鉴权与模型档位，见 llm/zhida.ts）。
#
# ⚠️ D1 现实约束（2026-09-12 team-lead 确认）：当前只有 ORIGAMI_API_KEY 配置了 key，
# 所以 extract / merge / orient 的 primary 直接绑 origami，deepseek/glm/qwen 作为
# fallback 条目保留 —— 未配置 key 的 provider 会在解析期被跳过（不发请求、不计 failover），
# 留着无害。等 DEEPSEEK_API_KEY 到位后，把 primary 切回官方直连即可。

providers:
  # 中转端点（OpenAI 兼容），当前唯一已配置 key 的服务商
  - name: origami
    baseUrl: https://ai.origami.pub/v1
    apiKeyEnv: ORIGAMI_API_KEY
    models: [deepseek-v4-flash, gemini-2.5-flash, gemini-3.6-flash]

  - name: deepseek
    baseUrl: https://api.deepseek.com/v1
    apiKeyEnv: DEEPSEEK_API_KEY
    models: [deepseek-chat, deepseek-reasoner]

  - name: glm
    baseUrl: https://open.bigmodel.cn/api/paas/v4
    apiKeyEnv: GLM_API_KEY
    models: [glm-4-flash, glm-4-plus]

  - name: qwen
    baseUrl: https://dashscope.aliyuncs.com/compatible-mode/v1
    apiKeyEnv: QWEN_API_KEY
    models: [qwen-plus, qwen-turbo]

agents:
  extract:
    provider: origami
    model: gemini-3.6-flash
    fallback: { provider: deepseek, model: deepseek-chat }
  merge:
    provider: origami
    model: deepseek-v4-flash
    fallback: { provider: deepseek, model: deepseek-reasoner }
  orient:
    provider: origami
    model: gemini-3.6-flash
    fallback: { provider: deepseek, model: deepseek-chat }
  # 查询语义扩写器（Origami / Gemini 2.5 Flash）：给争议问题
  # 扩写 ≤3 个「知乎用户可能提问这道题的相似问法」。3s 超时硬上限，失败退回原句。
  expand:
    provider: origami
    model: gemini-2.5-flash
    fallback: { provider: deepseek, model: deepseek-chat }

  # 薄样本救援合并的 Tier 2 裁决器（2026-09-12）：一次批量调用判定外题是否
  # 与主问题构成「同一场讨论」。宁缺毋滥，解析失败即跳过 Tier 2（优雅降级）。
  rescue:
    provider: origami
    model: gemini-3.6-flash
    fallback: { provider: deepseek, model: deepseek-chat }

  # 综述（刘看山人格解读，2026-09-12 起由外部 LLM 承载，不再走知乎直答 ——
  # 直答 100/日 额度瓶颈消除，D2 预生成不耗直答）。glm 未配置 key，留着的兜底是
  # 空转，所以 primary 也绑 origami（有 key 才是真正的兜底）。
  summary:
    provider: origami
    model: deepseek-v4-flash
    fallback: { provider: deepseek, model: deepseek-chat }
